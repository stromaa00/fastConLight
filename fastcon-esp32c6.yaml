# ESPHome configuration for Fastcon BLE Mesh Lighting
# Board: ESP32-C6 DevKitC-1
# Features: BLE 5.0, WiFi 6, RISC-V

substitutions:
  device_name: fastcon-esp32c6
  friendly_name: "Fastcon ESP32-C6"
  
esphome:
  name: ${device_name}
  platform: ESP32
  board: esp32-c6-devkitc-1
  
  platformio_options:
    platform: https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
    board_build.partitions: partitions_custom.csv
  
  # Include custom component
  includes:
    - components/fastcon/

# WiFi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ap_password

# Enable logging
logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Enable OTA updates
ota:
  password: !secret ota_password

# Enable web server
web_server:
  port: 80

# Fastcon component configuration
fastcon:
  id: fastcon_hub
  phone_key: "A1A2A3A4"  # Your BRMesh phone key (4 bytes hex)
  auto_discover: true

# Example lights - add your discovered devices here
light:
  - platform: fastcon
    name: "Kitchen Light"
    fastcon_id: fastcon_hub
    device_id: "AABBCCDDEEFF"  # Replace with your device ID
    device_type: "A83A"         # RGBCW light
    device_key: "11223344"      # Replace with your device key
    mesh_address: 1

# Buttons for scan and bind operations
button:
  - platform: template
    name: "Scan for Devices"
    icon: "mdi:magnify-scan"
    on_press:
      - fastcon.scan:
          id: fastcon_hub
          
  - platform: template
    name: "Bind All Devices"
    icon: "mdi:link-variant"
    on_press:
      - fastcon.bind_all:
          id: fastcon_hub

# Physical button on GPIO0
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Boot Button"
    on_click:
      - min_length: 50ms
        max_length: 1000ms
        then:
          # Short press: Scan
          - fastcon.scan:
              id: fastcon_hub
      - min_length: 1000ms
        max_length: 5000ms
        then:
          # Long press: Bind all
          - fastcon.bind_all:
              id: fastcon_hub

# Status indicators
sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s
    
  - platform: uptime
    name: "${friendly_name} Uptime"

text_sensor:
  - platform: version
    name: "${friendly_name} ESPHome Version"
    
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
