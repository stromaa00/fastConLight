# ESPHome configuration for Fastcon BLE Mesh Lighting
# Board: Heltec WiFi LoRa 32 V3
# Features: BLE 5.0, LoRa, OLED Display

substitutions:
  device_name: fastcon-heltec
  friendly_name: "Fastcon Heltec"
  
esphome:
  name: ${device_name}
  platform: ESP32
  board: heltec_wifi_lora_32_V3
  
  # Include custom component
  includes:
    - components/fastcon/

# WiFi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ap_password

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Enable OTA updates
ota:
  password: !secret ota_password

# Enable web server
web_server:
  port: 80

# Fastcon component configuration
fastcon:
  id: fastcon_hub
  phone_key: "A1A2A3A4"  # Your BRMesh phone key (4 bytes hex)
  auto_discover: true

# Example lights - add your discovered devices here
light:
  - platform: fastcon
    name: "Living Room Light"
    fastcon_id: fastcon_hub
    device_id: "EC0BF10A52F2"  # 6-byte hex from auto-discovery log
    device_type: "A8A1"         # 2-byte hex from auto-discovery log
    device_key: "5E367BC4"      # 4-byte hex from auto-discovery log
    mesh_address: 1
    
  - platform: fastcon
    name: "Bedroom Light"
    fastcon_id: fastcon_hub
    device_id: "E81656FB88D5"
    device_type: "A8A1"
    device_key: "5E367BC4"
    mesh_address: 2

# Buttons for scan and bind operations
button:
  - platform: template
    name: "Scan for Devices"
    icon: "mdi:magnify-scan"
    on_press:
      - fastcon.scan:
          id: fastcon_hub
          
  - platform: template
    name: "Bind All Devices"
    icon: "mdi:link-variant"
    on_press:
      - fastcon.bind_all:
          id: fastcon_hub

# Status sensor
sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s
    
  - platform: uptime
    name: "${friendly_name} Uptime"

# Text sensors
text_sensor:
  - platform: version
    name: "${friendly_name} ESPHome Version"
    
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
    ssid:
      name: "${friendly_name} SSID"
